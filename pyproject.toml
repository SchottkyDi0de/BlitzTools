[project]
name = "blitztools"
version = "0.1.0"
description = "Tools set for WoT BLitz"
authors = [
    {name = "_Zener",email = "vladislawzero@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "dearpygui (>=2.1.1,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "lz4 (>=4.4.5,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
