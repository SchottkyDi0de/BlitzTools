---
app_global:
  window:
    width: 800 # Minimal window width
    height: 500 # Minimal window height
    allow_resize: false # Allow window resize

  theming:
    # Только для win10 и выше. Автоматически опеределяет тему системы и акцентный цвет.
    # Установите False если хотите применить свои цвета
    auto_config: true 
    global_theme: "Dark" # "Dark", "Light"
    accent_color: '#89bf2d'
 
  # Шрифт текста в интерфейсе
  font:
    # "roboto", "robotomono", "jost"
    #  и italic вариации - "roboto_italic", "robotomono_italic", "jost_italic"
    name: "roboto" 
  # Язык интерфейса
  language: "ru"  # "en", "ru"

sessions:

olenemer:
  # Прозрачность окон оленемера
  window_transparency: 0.7

  # Позиция окон
  window_pos_left: [0, 0]
  window_pos_right: [800, 0]

  # Автоматическое открытие окон после нахождения реплея
  auto_open: true

  # Видимость столбцов
  column_status:
    nickname: true
    tank: true
    rating: true

converter:
...