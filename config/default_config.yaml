---
api:
  base_url: "http://77.221.157.72:8000/api/v1/"
  timeout: 10
  access_token: ""
  account_id: 0
  expires_at: 0

app_global:
  window:
    width: 1200
    height: 750
    pos: [100, 100]

  # Шрифт текста в интерфейсе
  font:
    name: "roboto" # "roboto", "robotomono", "jost"
    italic: false

  # Тема интерфейса
  theme: "dark" # "dark", "light"

  # Язык интерфейса
  language: "ru"  # "en", "ru"

  replay_paths:
    ru: "%userprofile%/Documents/TanksBlitz/replays"
    eu: "%userprofile%/AppData/Local/wotblitz/DAVAProject/replays"

sessions:

olenemer:
  enabled: true

  regions:
    ru: true
    eu: true

  # Прозрачность окон оленемера
  window_transparency: 0.8

  # Позиция окон: левое — левый верхний угол, правое — правый верхний угол
  window_pos_left: [0, 0]
  window_pos_right: [1200, 0]

  # Автоматическое открытие окон после нахождения реплея
  auto_open: true

  background_type: "transparent" # "transparent", "image"
  background_color: "#242424"
  background_image: "res/images/olenemer_background.png"

  keybinds:
    show_hide: "F1"
    increase_opacity: "F2"
    decrease_opacity: "F3"

  # Видимость столбцов (переключаются в UI: rating, battles, winrate, damage)
  column_status:
    avatar: false
    nickname: true
    tank: true
    rating: true
    platoon: true
    battles: true
    winrate: true
    damage: true

  # Фоны профилей (карточки) в строках игроков
  profile_skins: true

  # Отображение класса техники в колонке «Танк»: "icon" — иконка, "color" — цвет названия
  tank_display_type: "icon"

  # Разделители строк (акцентные полосы между строками)
  show_border: true

  # Обводка окна (акцентная рамка вокруг панели)
  show_window_border: true

  # Строка сводки (средние значения по команде)
  show_summary: true

converter:
  # Пустая строка — сохранять рядом с исходными файлами
  output_dir: ""

clusters:
  ru:
    - id: 0
      name: "login0.tanksblitz.ru"
    - id: 1
      name: "login1.tanksblitz.ru"
    - id: 2
      name: "login2.tanksblitz.ru"
    - id: 3
      name: "login3.tanksblitz.ru"
  eu:
    - id: 0
      name: "login0.wotblitz.eu"
    - id: 1
      name: "login1.wotblitz.eu"
    - id: 2
      name: "login2.wotblitz.eu"
    - id: 3
      name: "login3.wotblitz.eu"
    - id: 4
      name: "login4.wotblitz.eu"
  asia:
    - id: 0
      name: "login0.wotblitz.asia"
    - id: 1
      name: "login1.wotblitz.asia"
    - id: 2
      name: "login2.wotblitz.asia"
  na:
    - id: 0
      name: "login0.wotblitz.com"
    - id: 1
      name: "login1.wotblitz.com"
    - id: 2
      name: "login2.wotblitz.com"
...