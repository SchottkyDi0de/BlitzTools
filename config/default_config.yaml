---
app_global:
  window:
    width: 1200
    height: 750
    pos: [100, 100]

  # Шрифт текста в интерфейсе
  font:
    name: "roboto" # "roboto", "robotomono", "jost"
    italic: false

  # Тема интерфейса
  theme: "dark" # "dark", "light"

  # Язык интерфейса
  language: "ru"  # "en", "ru"

sessions:

olenemer:
  # Прозрачность окон оленемера
  window_transparency: 0.7

  # Позиция окон
  window_pos_left: [0, 0]
  window_pos_right: [1200, 0]

  # Автоматическое открытие окон после нахождения реплея
  auto_open: true

  # Видимость столбцов
  column_status:
    avatar: true
    nickname: true
    tank: true
    rating: true

converter:
  # Пустая строка — сохранять рядом с исходными файлами
  output_dir: ""

clusters:
